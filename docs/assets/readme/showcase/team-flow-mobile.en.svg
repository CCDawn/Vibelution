<svg id="mobile" xmlns="http://www.w3.org/2000/svg" width="600" height="580" viewBox="0 0 600 580" role="img" aria-labelledby="mt desc"><title id="mt">Team roles</title><desc id="desc">The planner assigns work to Developer A and Developer B. Both submit work to the reviewer. Role illustration, not a product screenshot or execution record.</desc><defs><marker id="ma" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="m1 1 7 4-7 4" fill="none" stroke="#41856f" stroke-width="1.6"/></marker></defs><rect x="1" y="1" width="598" height="578" rx="16" fill="#f3f8f5" stroke="#d6e5dd"/><g fill="none" stroke="#75a08c" stroke-width="2.5" marker-end="url(#ma)"><path d="M300 128V170H144V204"/><path d="M300 170H456V204"/><path d="M144 328V386H300V444"/><path d="M456 328V386H300" marker-end="none"/></g><g font-family="Segoe UI,Microsoft YaHei,sans-serif"><text x="332" y="158" fill="#507262" font-size="21">Assign</text><text x="332" y="421" fill="#507262" font-size="21">Review</text><rect x="180" y="24" width="240" height="104" rx="12" fill="#194d41"/><text x="208" y="67" fill="#fff" font-size="30" font-weight="600">Planner</text><text x="208" y="102" fill="#d0e3d8" font-size="22">Plan the work</text><g fill="#fff" stroke="#c7dbcf"><rect x="24" y="212" width="240" height="116" rx="12"/><rect x="336" y="212" width="240" height="116" rx="12"/></g><g fill="#243c31" font-size="27" font-weight="600"><text x="44" y="258">Developer A</text><text x="356" y="258">Developer B</text></g><g fill="#5b7566" font-size="22"><text x="44" y="296">Implementation</text><text x="356" y="296">Parallel work</text></g><rect x="180" y="452" width="240" height="104" rx="12" fill="#e1eddf" stroke="#b6cdb3"/><text x="208" y="495" fill="#2d4328" font-size="30" font-weight="600">Reviewer</text><text x="208" y="530" fill="#5b7054" font-size="22">Independent review</text></g></svg>