<svg id="desktop" xmlns="http://www.w3.org/2000/svg" width="960" height="320" viewBox="0 0 960 320" role="img" aria-labelledby="title desc">
<title id="title">Four roles from planning to review</title><desc id="desc">The planner assigns work to Developer A and Developer B. Both submit work to the reviewer. Role illustration, not a product screenshot or execution record.</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="m1 1 7 4-7 4" fill="none" stroke="#41856f" stroke-width="1.6"/></marker></defs>
<rect x="1" y="1" width="958" height="318" rx="16" fill="#f3f8f5" stroke="#d6e5dd"/>
<g fill="none" stroke="#75a08c" stroke-width="2" marker-end="url(#arrow)"><path d="M232 160H304V84H372"/><path d="M304 160V236H372"/><path d="M600 84H664V160H720"/><path d="M600 236H664V160" marker-end="none"/></g>
<g font-family="Segoe UI,Microsoft YaHei,sans-serif"><text x="272" y="145" font-size="15" fill="#507262">Assign</text><text x="677" y="145" font-size="15" fill="#507262">Review</text>
<rect x="32" y="100" width="200" height="120" rx="12" fill="#194d41"/><text x="56" y="131" fill="#afd4c1" font-size="13" letter-spacing="2">PLAN</text><text x="56" y="167" fill="#fff" font-size="26" font-weight="600">Planner</text><text x="56" y="197" fill="#d0e3d8" font-size="17">Plan the work</text>
<g fill="#fff" stroke="#c7dbcf"><rect x="380" y="32" width="220" height="104" rx="12"/><rect x="380" y="184" width="220" height="104" rx="12"/></g><g fill="#243c31"><text x="404" y="74" font-size="24" font-weight="600">Developer A</text><text x="404" y="226" font-size="24" font-weight="600">Developer B</text></g><g fill="#5b7566" font-size="17"><text x="404" y="106">Implementation</text><text x="404" y="258">Parallel work</text></g>
<rect x="728" y="100" width="200" height="120" rx="12" fill="#e1eddf" stroke="#b6cdb3"/><text x="752" y="131" fill="#63805b" font-size="13" letter-spacing="2">REVIEW</text><text x="752" y="167" fill="#2d4328" font-size="26" font-weight="600">Reviewer</text><text x="752" y="197" fill="#5b7054" font-size="17">Independent review</text></g></svg>