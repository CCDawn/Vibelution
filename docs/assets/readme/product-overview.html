    :root { color-scheme: light; font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", "Microsoft YaHei", sans-serif; color: #232b4d; background: #eef1f7; }
    * { box-sizing: border-box; }
    body { margin: 0; padding: 24px; }
    .frame { position: relative; width: min(100%, 1240px); margin: 0 auto; }
    .language-input { position: absolute; width: 1px; height: 1px; overflow: hidden; clip-path: inset(50%); white-space: nowrap; }
    .toolbar { display: flex; align-items: center; justify-content: space-between; gap: 16px; margin: 0 0 12px; }
    .toolbar-title { margin: 0; color: #6c7593; font-size: 12px; font-weight: 650; letter-spacing: .12em; text-transform: uppercase; }
    .language-switch { display: inline-flex; gap: 2px; padding: 3px; border: 1px solid #dce2ef; border-radius: 999px; background: #fff; }
    .language-switch label { padding: 6px 12px; border-radius: 999px; color: #69728e; font-size: 13px; cursor: pointer; }
    #lang-zh:focus-visible ~ .toolbar label[for="lang-zh"], #lang-en:focus-visible ~ .toolbar label[for="lang-en"] { outline: 2px solid #5572e8; outline-offset: 2px; }
    #lang-zh:checked ~ .toolbar label[for="lang-zh"], #lang-en:checked ~ .toolbar label[for="lang-en"] { color: #26315f; background: #eef1fb; font-weight: 650; }
    .canvas { overflow: hidden; border: 1px solid #e0e5f0; border-radius: 18px; background: #f7f8fc; }
    .canvas svg { display: block; width: 100%; height: auto; }
    .canvas .mobile { display: none; }
    #lang-en:checked ~ .canvas .zh, #lang-zh:checked ~ .canvas .en { display: none; }
    @media (max-width: 620px) {
      body { padding: 12px; }
      .toolbar { margin-bottom: 8px; }
      .toolbar-title { font-size: 10px; letter-spacing: .08em; }
      .language-switch label { padding: 5px 9px; font-size: 12px; }
      .canvas { border-radius: 12px; }
      .canvas .desktop { display: none; }
      .canvas .mobile { display: block; }
    }
  </style>
</head>
