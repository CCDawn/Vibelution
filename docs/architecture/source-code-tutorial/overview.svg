<svg xmlns="http://www.w3.org/2000/svg" width="1300" height="960" viewBox="0 0 1300 960" role="img" aria-label="Vibelution 本机技术分层图"><defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#31768e"/></marker></defs><rect width="1300" height="960" rx="18" fill="#f1f6fa"/><g font-family="Microsoft YaHei, sans-serif" fill="#19384d"><text x="55" y="48" font-size="26" font-weight="700">Vibelution · 界面、控制、执行与存储</text><rect x="55" y="80" width="535" height="105" rx="12" fill="#e6f3f6" stroke="#c8d9e4"/><text x="77" y="114" font-size="21" font-weight="700">浏览器：React 工作台</text><text x="77" y="145" font-size="16">web/src · 页面、组件、API client、SSE 接收</text><rect x="710" y="80" width="535" height="105" rx="12" fill="#e6f3f6" stroke="#c8d9e4"/><text x="732" y="114" font-size="21" font-weight="700">桌面：Electron renderer</text><text x="732" y="145" font-size="16">大体复用同一 React UI；原生能力经 preload</text><rect x="55" y="275" width="535" height="120" rx="12" fill="#e8eef9" stroke="#c8d9e4"/><text x="77" y="309" font-size="21" font-weight="700">FastAPI 本机 HTTP 边界</text><text x="77" y="340" font-size="16">core/web · 参数/权限校验、路由、JSON 与 SSE</text><text x="77" y="365" font-size="16">业务路由委托 service，而非浏览器直接连数据库</text><rect x="710" y="275" width="535" height="120" rx="12" fill="#f7ecd9" stroke="#c8d9e4"/><text x="732" y="309" font-size="21" font-weight="700">Electron main：生命周期控制</text><text x="732" y="340" font-size="16">desktop/electron · 窗口、托盘、启动/关闭/重建</text><text x="732" y="365" font-size="16">官方 EXE shim → main → 托管 Python 后端</text><rect x="55" y="485" width="725" height="130" rx="12" fill="#e5f2eb" stroke="#c8d9e4"/><text x="77" y="519" font-size="21" font-weight="700">领域服务 + Agent Runtime + 工具执行</text><text x="77" y="550" font-size="16">Session submit → schedule → worker → 模型/工具循环</text><text x="77" y="575" font-size="16">core/orchestration · core/llm · core/authorization · tools/</text><text x="77" y="600" font-size="16">多智能体、正式知识、工作流各有明确 owner</text><rect x="925" y="485" width="320" height="130" rx="12" fill="#f2eafa" stroke="#c8d9e4"/><text x="947" y="519" font-size="21" font-weight="700">模型 Provider</text><text x="947" y="550" font-size="16">本地或云端推理服务</text><text x="947" y="575" font-size="16">密钥由后端解析，非页面持有</text><rect x="55" y="730" width="360" height="140" rx="12" fill="#e8eef9" stroke="#c8d9e4"/><text x="77" y="764" font-size="21" font-weight="700">SQLite 控制与工作流</text><text x="77" y="795" font-size="16">会话目录、Agent 引用/快照</text><text x="77" y="820" font-size="16">Workflow Ledger 等专用库</text><text x="77" y="845" font-size="16">不是全部对话正文的数据库</text><rect x="470" y="730" width="360" height="140" rx="12" fill="#e6f3f6" stroke="#c8d9e4"/><text x="492" y="764" font-size="21" font-weight="700">JSONL 对话事件账本</text><text x="492" y="795" font-size="16">turn_journal.jsonl</text><text x="492" y="820" font-size="16">用户、助手、工具与 Turn 终态</text><text x="492" y="845" font-size="16">UI 与模型历史从此投影</text><rect x="885" y="730" width="360" height="140" rx="12" fill="#e5f2eb" stroke="#c8d9e4"/><text x="907" y="764" font-size="21" font-weight="700">正式知识 + 派生向量</text><text x="907" y="795" font-size="16">Owner JSON/JSONL / 来源文件</text><text x="907" y="820" font-size="16">FastEmbed + 文件型向量索引</text><text x="907" y="845" font-size="16">BM25 / cosine / RRF</text><path d="M320 185 L320 275" fill="none" stroke="#31768e" stroke-width="3" marker-end="url(#arrow)"/><text x="337" y="236" font-size="15" fill="#295b70">HTTP JSON / SSE</text><path d="M780 185 L780 220 L535 220 L535 275" fill="none" stroke="#31768e" stroke-width="3" marker-end="url(#arrow)"/><text x="560" y="209" font-size="15" fill="#295b70">同一业务 API</text><path d="M1075 185 L1075 275" fill="none" stroke="#31768e" stroke-width="3" marker-end="url(#arrow)"/><text x="1090" y="236" font-size="15" fill="#295b70">受限 IPC</text><path d="M710 344 L590 344" fill="none" stroke="#31768e" stroke-width="3" marker-end="url(#arrow)"/><text x="620" y="330" font-size="15" fill="#295b70">托管后端</text><path d="M325 395 L325 485" fill="none" stroke="#31768e" stroke-width="3" marker-end="url(#arrow)"/><text x="343" y="450" font-size="15" fill="#295b70">调用服务/执行</text><path d="M780 548 L925 548" fill="none" stroke="#31768e" stroke-width="3" marker-end="url(#arrow)"/><text x="789" y="529" font-size="15" fill="#295b70">HTTPS / 协议适配</text><path d="M230 615 L230 730" fill="none" stroke="#31768e" stroke-width="3" marker-end="url(#arrow)"/><path d="M650 615 L650 730" fill="none" stroke="#31768e" stroke-width="3" marker-end="url(#arrow)"/><path d="M730 615 L730 675 L1060 675 L1060 730" fill="none" stroke="#31768e" stroke-width="3" marker-end="url(#arrow)"/><text x="55" y="920" font-size="17" fill="#526b7c">当前核心没有 MySQL 接入；向量索引是可重建派生数据，不能取代正式知识和权限。</text></g></svg>