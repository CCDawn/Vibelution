<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>AI 最新动态搜索结果台账</title>
  <style>
    :root {
      --bg: #101215;
      --panel: #171b20;
      --panel-strong: #1e242b;
      --line: #303842;
      --line-soft: #222a32;
      --text: #e7edf2;
      --muted: #9ca9b5;
      --quiet: #697987;
      --cyan: #59c3d9;
      --amber: #e7bb64;
      --green: #7fc98c;
      --red: #e27272;
      --ink: #060708;
      --shadow: 0 18px 42px rgba(0, 0, 0, 0.32);
    }

    * {
      box-sizing: border-box;
    }

    html,
    body {
      width: 100%;
      max-width: 100%;
    }

    body {
      margin: 0;
      min-height: 100vh;
      color: var(--text);
      background:
        linear-gradient(120deg, rgba(89, 195, 217, 0.08), transparent 34%),
        radial-gradient(circle at 82% 0%, rgba(231, 187, 100, 0.1), transparent 30%),
        var(--bg);
      font-family: "Microsoft YaHei UI", "Segoe UI", sans-serif;
      letter-spacing: 0;
      overflow-x: hidden;
    }

    button,
    input,
    select {
      font: inherit;
    }

    .page {
      width: calc(100vw - 40px);
      max-width: 1480px;
      margin: 0 auto;
      padding: 28px 0 44px;
    }

    .topbar {
      display: grid;
      grid-template-columns: minmax(260px, 1fr) auto;
      gap: 20px;
      align-items: end;
      padding-bottom: 18px;
      border-bottom: 1px solid var(--line);
    }

    h1 {
      margin: 0;
      font-size: 42px;
      line-height: 1.02;
      font-weight: 800;
    }

    h1,
    .subtitle,
    .run-title,
    .summary,
    .source a,
    .action-list li,
    .run-meta span,
    .tag {
      overflow-wrap: anywhere;
    }

    .subtitle {
      max-width: 820px;
      margin: 12px 0 0;
      color: var(--muted);
      line-height: 1.7;
      font-size: 14px;
    }

    .top-actions {
      display: flex;
      flex-wrap: wrap;
      justify-content: flex-end;
      gap: 10px;
    }

    .topbar > *,
    .run-header > *,
    .run-body > *,
    .section,
    .run-kicker,
    .run-meta,
    .source,
    .source > * {
      min-width: 0;
      max-width: 100%;
    }

    .pill,
    .icon-btn {
      min-height: 38px;
      border: 1px solid var(--line);
      border-radius: 6px;
      background: rgba(23, 27, 32, 0.86);
      color: var(--text);
    }

    .pill {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      padding: 0 12px;
      white-space: nowrap;
    }

    .icon-btn {
      width: 42px;
      display: inline-grid;
      place-items: center;
      cursor: pointer;
    }

    .icon-btn:hover,
    .run-card:hover {
      border-color: rgba(89, 195, 217, 0.72);
    }

    .metrics {
      display: grid;
      grid-template-columns: repeat(4, minmax(130px, 1fr));
      gap: 10px;
      margin: 18px 0;
    }

    .metric {
      border: 1px solid var(--line-soft);
      border-radius: 6px;
      background: rgba(23, 27, 32, 0.7);
      padding: 14px;
    }

    .metric-label {
      color: var(--quiet);
      font-size: 12px;
    }

    .metric-value {
      margin-top: 6px;
      font-size: 22px;
      font-weight: 800;
    }

    .toolbar {
      display: grid;
      grid-template-columns: minmax(240px, 1fr) 172px 172px;
      gap: 10px;
      margin: 16px 0 20px;
    }

    .field {
      position: relative;
    }

    .field svg {
      position: absolute;
      top: 50%;
      left: 12px;
      width: 18px;
      height: 18px;
      transform: translateY(-50%);
      color: var(--quiet);
      pointer-events: none;
    }

    input,
    select {
      width: 100%;
      height: 42px;
      border: 1px solid var(--line);
      border-radius: 6px;
      background: rgba(14, 17, 20, 0.9);
      color: var(--text);
      outline: none;
    }

    input {
      padding: 0 12px 0 40px;
    }

    select {
      padding: 0 12px;
      cursor: pointer;
    }

    input:focus,
    select:focus {
      border-color: var(--cyan);
      box-shadow: 0 0 0 3px rgba(89, 195, 217, 0.14);
    }

    .ledger {
      display: grid;
      gap: 12px;
    }

    .run-card {
      border: 1px solid var(--line);
      border-radius: 8px;
      background: rgba(23, 27, 32, 0.88);
      box-shadow: var(--shadow);
      overflow: hidden;
      transition: border-color 160ms ease, transform 160ms ease;
    }

    .run-card:hover {
      transform: translateY(-1px);
    }

    .run-header {
      display: grid;
      grid-template-columns: 1fr auto;
      gap: 18px;
      padding: 18px;
      border-bottom: 1px solid var(--line-soft);
      background: linear-gradient(90deg, rgba(30, 36, 43, 0.98), rgba(23, 27, 32, 0.74));
    }

    .run-kicker {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      margin-bottom: 9px;
    }

    .tag {
      display: inline-flex;
      align-items: center;
      min-height: 24px;
      border: 1px solid var(--line);
      border-radius: 999px;
      padding: 0 9px;
      color: var(--muted);
      font-size: 12px;
      white-space: nowrap;
    }

    .tag.hot {
      border-color: rgba(231, 187, 100, 0.54);
      color: var(--amber);
    }

    .tag.done {
      border-color: rgba(127, 201, 140, 0.48);
      color: var(--green);
    }

    .tag.watch {
      border-color: rgba(89, 195, 217, 0.48);
      color: var(--cyan);
    }

    .run-title {
      margin: 0;
      font-size: 20px;
      line-height: 1.32;
    }

    .run-meta {
      display: flex;
      flex-wrap: wrap;
      gap: 12px;
      margin-top: 10px;
      color: var(--quiet);
      font-size: 12px;
    }

    .score {
      width: 108px;
      min-height: 96px;
      display: grid;
      align-content: center;
      justify-items: center;
      border: 1px solid var(--line);
      border-radius: 7px;
      background: var(--ink);
    }

    .score strong {
      color: var(--amber);
      font-size: 32px;
      line-height: 1;
    }

    .score span {
      margin-top: 8px;
      color: var(--quiet);
      font-size: 12px;
    }

    .run-body {
      display: grid;
      grid-template-columns: minmax(260px, 0.92fr) minmax(360px, 1.6fr) minmax(240px, 0.86fr);
      gap: 0;
    }

    .section {
      padding: 16px 18px;
      border-right: 1px solid var(--line-soft);
    }

    .section:last-child {
      border-right: 0;
    }

    .section-title {
      margin: 0 0 12px;
      color: var(--quiet);
      font-size: 12px;
      text-transform: uppercase;
      letter-spacing: 0;
    }

    .summary {
      margin: 0;
      color: var(--text);
      line-height: 1.72;
      font-size: 14px;
    }

    .source-list {
      display: grid;
      gap: 8px;
    }

    .source {
      display: grid;
      grid-template-columns: 64px 1fr auto;
      gap: 10px;
      align-items: center;
      min-height: 42px;
      border: 1px solid var(--line-soft);
      border-radius: 6px;
      padding: 8px 10px;
      background: rgba(14, 17, 20, 0.64);
    }

    .source-kind {
      color: var(--cyan);
      font-size: 12px;
      font-weight: 700;
    }

    .source a {
      color: var(--text);
      text-decoration: none;
      line-height: 1.35;
    }

    .source a:hover {
      color: var(--cyan);
      text-decoration: underline;
    }

    .source-date {
      color: var(--quiet);
      font-size: 12px;
      white-space: nowrap;
    }

    .action-list {
      display: grid;
      gap: 8px;
      margin: 0;
      padding: 0;
      list-style: none;
    }

    .action-list li {
      display: grid;
      grid-template-columns: 18px 1fr;
      gap: 8px;
      color: var(--muted);
      font-size: 13px;
      line-height: 1.55;
    }

    .action-list li::before {
      content: "";
      width: 8px;
      height: 8px;
      margin-top: 7px;
      border-radius: 50%;
      background: var(--amber);
    }

    .empty {
      border: 1px dashed var(--line);
      border-radius: 8px;
      padding: 30px;
      color: var(--muted);
      text-align: center;
      background: rgba(23, 27, 32, 0.54);
    }

    .template-note {
      margin-top: 18px;
      border-left: 3px solid var(--cyan);
      padding: 12px 14px;
      color: var(--muted);
      background: rgba(89, 195, 217, 0.08);
      line-height: 1.65;
      font-size: 13px;
    }

    .light {
      --bg: #f4f0e8;
      --panel: #ffffff;
      --panel-strong: #f4f7f7;
      --line: #cfd8dd;
      --line-soft: #e1e7eb;
      --text: #172027;
      --muted: #4e5d68;
      --quiet: #71808a;
      --cyan: #087f95;
      --amber: #9c6a08;
      --green: #387d45;
      --red: #b54343;
      --ink: #ffffff;
      --shadow: 0 18px 36px rgba(45, 55, 63, 0.13);
    }

    .light .run-card,
    .light .metric,
    .light .pill,
    .light .icon-btn {
      background: rgba(255, 255, 255, 0.9);
    }

    .light input,
    .light select,
    .light .source {
      background: rgba(255, 255, 255, 0.86);
    }

    @media (max-width: 1080px) {
      .topbar,
      .run-header,
      .run-body {
        grid-template-columns: 1fr;
      }

      .top-actions {
        justify-content: flex-start;
      }

      .score {
        width: 100%;
        min-height: 74px;
      }

      .section {
        border-right: 0;
        border-bottom: 1px solid var(--line-soft);
      }

      .section:last-child {
        border-bottom: 0;
      }
    }

    @media (max-width: 720px) {
      .page {
        width: calc(100vw - 18px);
        padding-top: 18px;
      }

      h1 {
        font-size: 27px;
        line-height: 1.1;
      }

      .subtitle {
        font-size: 13px;
      }

      .metrics,
      .toolbar {
        grid-template-columns: 1fr;
      }

      .source {
        grid-template-columns: 1fr;
      }

      .source-date {
        white-space: normal;
      }

      h1,
      .subtitle,
      .run-title,
      .summary,
      .source a,
      .action-list li,
      .run-meta span,
      .tag {
        word-break: break-all;
      }
    }
  </style>
</head>
<body>
  <main class="page">
    <header class="topbar">
      <div>
        <h1>AI 最新动态搜索结果台账</h1>
        <p class="subtitle">一次搜索任务对应一个批次卡片。后续真实搜索团队只需要把新批次追加到页面数据源，就能保留搜索目标、来源证据、重要性判断和下一步动作。</p>
      </div>
      <div class="top-actions" aria-label="页面工具">
        <span class="pill" id="lastUpdated">等待渲染</span>
        <button class="icon-btn" id="themeToggle" type="button" title="切换明暗主题" aria-label="切换明暗主题">
          <svg viewBox="0 0 24 24" aria-hidden="true">
            <path fill="currentColor" d="M12 2a1 1 0 0 1 1 1v2a1 1 0 1 1-2 0V3a1 1 0 0 1 1-1Zm0 16a6 6 0 1 0 0-12 6 6 0 0 0 0 12Zm9-7a1 1 0 1 1 0 2h-2a1 1 0 1 1 0-2h2ZM5 11a1 1 0 1 1 0 2H3a1 1 0 1 1 0-2h2Zm12.95-6.36a1 1 0 0 1 1.41 1.41l-1.41 1.42a1 1 0 0 1-1.42-1.42l1.42-1.41ZM6.05 16.54a1 1 0 0 1 1.42 1.41l-1.42 1.41a1 1 0 0 1-1.41-1.41l1.41-1.41Zm13.31 1.41a1 1 0 0 1-1.41 1.41l-1.42-1.41a1 1 0 0 1 1.42-1.41l1.41 1.41ZM7.47 6.05a1 1 0 1 1-1.42 1.42L4.64 6.05a1 1 0 1 1 1.41-1.41l1.42 1.41Z"/>
          </svg>
        </button>
      </div>
    </header>

    <section class="metrics" aria-label="搜索批次统计">
      <article class="metric">
        <div class="metric-label">搜索批次</div>
        <div class="metric-value" id="metricRuns">0</div>
      </article>
      <article class="metric">
        <div class="metric-label">来源条目</div>
        <div class="metric-value" id="metricSources">0</div>
      </article>
      <article class="metric">
        <div class="metric-label">高优先级批次</div>
        <div class="metric-value" id="metricHot">0</div>
      </article>
      <article class="metric">
        <div class="metric-label">覆盖领域</div>
        <div class="metric-value" id="metricDomains">0</div>
      </article>
    </section>

    <section class="toolbar" aria-label="筛选搜索结果">
      <label class="field">
        <svg viewBox="0 0 24 24" aria-hidden="true">
          <path fill="currentColor" d="M10.5 4a6.5 6.5 0 0 1 5.16 10.45l4.45 4.44a1 1 0 0 1-1.42 1.42l-4.44-4.45A6.5 6.5 0 1 1 10.5 4Zm0 2a4.5 4.5 0 1 0 0 9 4.5 4.5 0 0 0 0-9Z"/>
        </svg>
        <input id="searchInput" type="search" placeholder="筛选主题、摘要、来源或下一步动作">
      </label>
      <select id="domainFilter" aria-label="按领域筛选">
        <option value="all">全部领域</option>
      </select>
      <select id="priorityFilter" aria-label="按优先级筛选">
        <option value="all">全部优先级</option>
        <option value="高">高优先级</option>
        <option value="中">中优先级</option>
        <option value="低">低优先级</option>
      </select>
    </section>

    <section class="ledger" id="ledger" aria-live="polite"></section>

    <p class="template-note">追加新搜索批次时，复制脚本中的 <code>SEARCH_RUNS</code> 对象结构即可。后续如果接入真实搜索，可以把一键搜索结果写成同样的数据结构，再重新渲染这个页面。</p>
  </main>

  <script>
    const SEARCH_RUNS = [
      {
        id: "ai-search-2026-06-11-001",
        topic: "主流 AI 领域最新动态基线搜索",
        triggeredAt: "2026-06-11T14:00:00+08:00",
        domains: ["模型发布", "研究论文", "开源工具", "产品动态"],
        priority: "高",
        status: "样例批次",
        resultCount: 6,
        importanceScore: 86,
        summary: "这是第一版展示样例，用来固定批次卡片结构。正式搜索结果应在这里写明本轮最重要变化、为什么值得关注、是否需要进入深挖或知识库候选队列。",
        sources: [
          {
            kind: "News",
            title: "示例来源：模型或产品更新报道",
            url: "#",
            date: "待真实搜索填充"
          },
          {
            kind: "Paper",
            title: "示例来源：研究论文、技术报告或评测结果",
            url: "#",
            date: "待真实搜索填充"
          },
          {
            kind: "Repo",
            title: "示例来源：开源项目、框架或工具链变化",
            url: "#",
            date: "待真实搜索填充"
          }
        ],
        nextActions: [
          "确认真实搜索源白名单：官方博客、论文站点、GitHub、AI 新闻站、社交平台信号。",
          "定义重要性评分规则：新模型、新能力、真实采用、开源可用性、对 Vibelution 的影响。",
          "决定后续是否把高优先级条目转成知识候选或研究任务。"
        ]
      },
      {
        id: "ai-search-2026-06-11-002",
        topic: "Agent / 工具使用方向观察",
        triggeredAt: "2026-06-11T14:20:00+08:00",
        domains: ["Agent", "工具调用", "评测"],
        priority: "中",
        status: "样例批次",
        resultCount: 4,
        importanceScore: 72,
        summary: "用于展示同一页面如何容纳多次搜索。每张卡片保留独立主题、覆盖领域、来源列表和下一步动作，避免把不同搜索轮次混成一团。",
        sources: [
          {
            kind: "Blog",
            title: "示例来源：Agent 产品或框架更新",
            url: "#",
            date: "待真实搜索填充"
          },
          {
            kind: "Eval",
            title: "示例来源：工具使用或多步任务评测",
            url: "#",
            date: "待真实搜索填充"
          }
        ],
        nextActions: [
          "抽取对 Vibelution 有影响的 agent 行为模式。",
          "标记需要复现或本地验证的工具链变化。"
        ]
      }
    ];

    const ledger = document.querySelector("#ledger");
    const searchInput = document.querySelector("#searchInput");
    const domainFilter = document.querySelector("#domainFilter");
    const priorityFilter = document.querySelector("#priorityFilter");
    const themeToggle = document.querySelector("#themeToggle");

    function formatTime(value) {
      const date = new Date(value);
      if (Number.isNaN(date.getTime())) {
        return value;
      }
      return new Intl.DateTimeFormat("zh-CN", {
        year: "numeric",
        month: "2-digit",
        day: "2-digit",
        hour: "2-digit",
        minute: "2-digit"
      }).format(date);
    }

    function collectText(run) {
      return [
        run.topic,
        run.summary,
        run.status,
        run.priority,
        ...run.domains,
        ...run.sources.map((source) => `${source.kind} ${source.title} ${source.date}`),
        ...run.nextActions
      ].join(" ").toLowerCase();
    }

    function renderDomainOptions() {
      const domains = [...new Set(SEARCH_RUNS.flatMap((run) => run.domains))].sort((a, b) => a.localeCompare(b, "zh-CN"));
      domainFilter.innerHTML = `<option value="all">全部领域</option>${domains.map((domain) => `<option value="${domain}">${domain}</option>`).join("")}`;
    }

    function renderMetrics(runs) {
      const domainCount = new Set(runs.flatMap((run) => run.domains)).size;
      const sourceCount = runs.reduce((total, run) => total + run.sources.length, 0);
      const hotCount = runs.filter((run) => run.priority === "高").length;
      document.querySelector("#metricRuns").textContent = runs.length;
      document.querySelector("#metricSources").textContent = sourceCount;
      document.querySelector("#metricHot").textContent = hotCount;
      document.querySelector("#metricDomains").textContent = domainCount;
      document.querySelector("#lastUpdated").textContent = `更新于 ${formatTime(new Date().toISOString())}`;
    }

    function tagClass(value) {
      if (value === "高" || value.includes("模型")) return "hot";
      if (value === "样例批次") return "watch";
      if (value === "完成") return "done";
      return "";
    }

    function renderRun(run) {
      const tags = [run.priority, run.status, ...run.domains]
        .map((tag) => `<span class="tag ${tagClass(tag)}">${tag}</span>`)
        .join("");
      const sources = run.sources.map((source) => `
        <article class="source">
          <span class="source-kind">${source.kind}</span>
          <a href="${source.url}" target="_blank" rel="noreferrer">${source.title}</a>
          <span class="source-date">${source.date}</span>
        </article>
      `).join("");
      const actions = run.nextActions.map((action) => `<li>${action}</li>`).join("");

      return `
        <article class="run-card" data-id="${run.id}">
          <header class="run-header">
            <div>
              <div class="run-kicker">${tags}</div>
              <h2 class="run-title">${run.topic}</h2>
              <div class="run-meta">
                <span>批次 ${run.id}</span>
                <span>触发时间 ${formatTime(run.triggeredAt)}</span>
                <span>结果 ${run.resultCount} 条</span>
              </div>
            </div>
            <aside class="score" aria-label="重要性评分">
              <strong>${run.importanceScore}</strong>
              <span>重要性评分</span>
            </aside>
          </header>
          <div class="run-body">
            <section class="section">
              <h3 class="section-title">本轮摘要</h3>
              <p class="summary">${run.summary}</p>
            </section>
            <section class="section">
              <h3 class="section-title">来源证据</h3>
              <div class="source-list">${sources}</div>
            </section>
            <section class="section">
              <h3 class="section-title">后续动作</h3>
              <ul class="action-list">${actions}</ul>
            </section>
          </div>
        </article>
      `;
    }

    function getFilteredRuns() {
      const query = searchInput.value.trim().toLowerCase();
      const domain = domainFilter.value;
      const priority = priorityFilter.value;
      return SEARCH_RUNS.filter((run) => {
        const matchesQuery = !query || collectText(run).includes(query);
        const matchesDomain = domain === "all" || run.domains.includes(domain);
        const matchesPriority = priority === "all" || run.priority === priority;
        return matchesQuery && matchesDomain && matchesPriority;
      });
    }

    function render() {
      const runs = getFilteredRuns();
      renderMetrics(runs);
      ledger.innerHTML = runs.length
        ? runs.map(renderRun).join("")
        : `<div class="empty">没有匹配的搜索批次。清空筛选条件后重试。</div>`;
    }

    searchInput.addEventListener("input", render);
    domainFilter.addEventListener("change", render);
    priorityFilter.addEventListener("change", render);
    themeToggle.addEventListener("click", () => {
      document.body.classList.toggle("light");
    });

    renderDomainOptions();
    render();
  </script>
</body>
</html>
