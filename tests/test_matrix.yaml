version: 1

always:
  executionLayers:
    - "hygiene"
  commands:
    - "git diff --check"

default:
  executionLayers:
    - "focused"
  commands:
    - ".\\.venv\\Scripts\\python.exe -m pytest tests/test_runner.py -q"
  notes:
    - "No focused rule matched; use the runner smoke as a small signal and decide broader validation from the changed surface."

rules:
  - id: test-tooling
    description: "Test runner, selector, pytest fixtures, and test documentation."
    executionLayers:
      - "focused"
      - "local-parallel"
      - "remote-distributed"
    paths:
      - "tests/test_matrix.yaml"
      - "tests/select_tests.py"
      - "tests/test_select_tests.py"
      - "tests/test_runner.py"
      - "tests/test_remote_test_runner.py"
      - "tests/conftest.py"
      - "scripts/remote_test_runner.py"
    commands:
      - ".\\.venv\\Scripts\\python.exe -m pytest tests/test_select_tests.py tests/test_runner.py -q"
      - ".\\.venv\\Scripts\\python.exe -m pytest tests/test_remote_test_runner.py -q"
    notes:
      - "Pure test-tooling changes do not require Launcher refresh."
      - "Remote distributed testing is a speed path for Python not-serial coverage; it is not a complete gate."

  - id: local-quality-gate
    description: "Local commit hook, closeout manifest, doctor, selector, and manual CI contracts."
    executionLayers:
      - "focused"
      - "local-serial"
    paths:
      - ".githooks/pre-commit"
      - ".github/workflows/ci.yml"
      - "scripts/doctor.ps1"
      - "scripts/local_quality_gate.py"
      - "scripts/task_closeout.py"
      - "tests/select_tests.py"
      - "tests/test_matrix.yaml"
      - "tests/test_local_quality_gate.py"
      - "tests/test_task_closeout.py"
      - "tests/test_ci_workflow_contract.py"
      - "tests/test_environment_doctor.py"
      - "tests/test_select_tests.py"
    commands:
      - ".\\.venv\\Scripts\\python.exe -m pytest tests/test_local_quality_gate.py tests/test_task_closeout.py tests/test_ci_workflow_contract.py tests/test_environment_doctor.py tests/test_select_tests.py tests/test_reuse_research_contract.py tests/test_github_project_library_service.py -q"
    notes:
      - "Gate-definition changes must validate the gate itself even when the matrix changes in the same branch."

  - id: agent-runtime-core
    description: "Agent single-turn entry, orchestration, turn status bar, and budget profiles."
    executionLayers:
      - "focused"
      - "local-parallel"
    paths:
      - "agent.py"
      - "core/orchestration/**"
      - "core/orchestration/turn_status_bar.py"
      - "core/orchestration/tool_budget_profiles.py"
      - "tests/test_turn_status_bar_and_budget_profiles.py"
      - "tests/test_agent_protocol.py"
      - "tests/test_agent_kernel_adapters.py"
      - "tests/test_agent_kernel_source_authority.py"
    commands:
      - ".\\.venv\\Scripts\\python.exe -m pytest tests/test_turn_status_bar_and_budget_profiles.py tests/test_agent_protocol.py tests/test_agent_kernel_adapters.py tests/test_agent_kernel_source_authority.py -q"
    notes:
      - "agent.py changes almost always need Launcher/runtime restart before live chat verification."
      - "Prefer focused orchestration tests before full agent regression."

  - id: service-structure-ownership
    description: "Web service pack structure guards and Agent services index README."
    executionLayers:
      - "focused"
      - "local-parallel"
    paths:
      - "core/web/services/README.md"
      - "core/web/services/**/README.md"
      - "scripts/_gen_services_readme.py"
      - "tests/test_service_structure_guards.py"
      - "tests/test_service_pack_path_literals.py"
    commands:
      - ".\\.venv\\Scripts\\python.exe -m pytest tests/test_service_structure_guards.py tests/test_service_pack_path_literals.py -q"
    notes:
      - "New *_service.py facades must appear in core/web/services/README.md (regen via scripts/_gen_services_readme.py)."

  - id: web-session-chat
    description: "Direct chat, session routes, and room service/route behavior."
    executionLayers:
      - "focused"
      - "local-serial"
    paths:
      - "core/web/services/session_service.py"
      - "core/web/services/session/**"
      - "core/web/services/chat_room_service.py"
      - "core/web/routes/sessions.py"
      - "core/web/routes/chat_rooms.py"
      - "tests/test_web_app.py"
      - "tests/test_web_session_routes.py"
      - "tests/test_chat_room_service.py"
      - "tests/test_chat_room_routes.py"
      - "tests/helpers/web_chat_state.py"
    commands:
      - ".\\.venv\\Scripts\\python.exe -m pytest tests/test_web_session_routes.py tests/test_chat_room_service.py tests/test_chat_room_routes.py -q"
    notes:
      - "Use the route/service subset first; widen to tests/test_web_app.py only when shared app fixtures or legacy route coverage changed."

  - id: web-session-chat-ui
    description: "Chat route and conversation UI focused validation."
    executionLayers:
      - "focused"
      - "frontend"
    paths:
      - "web/src/routes/ChatCodingRoute.tsx"
      - "web/src/routes/ChatCodingRoute.styles.ts"
      - "web/src/routes/ChatCodingRoute.layout.test.ts"
      - "web/src/routes/ChatCodingRoute.*"
      - "web/src/routes/chat/**"
      - "web/src/components/conversation/**"
    commands:
      - "node web/node_modules/vitest/vitest.mjs run src/routes/ChatCodingRoute.layout.test.ts"
      - "node web/node_modules/vitest/vitest.mjs run src/components/vui/vuiShadcnRouteContract.test.ts src/components/vui/vuiComponentDesignContract.test.ts"
      - "npm --prefix web exec -- tsc -b --pretty false"
    notes:
      - "Small Chat UI changes keep a focused route test, both VUI contracts, and incremental typecheck; they do not imply backend pytest or a full build."

  - id: web-runtime-launcher
    description: "Launcher, runtime manager, runtime scene, and runtime route behavior."
    executionLayers:
      - "focused"
      - "local-serial"
    paths:
      - "core/runtime_manager/**"
      - "core/web/services/runtime_scene_service.py"
      - "core/web/routes/runtime.py"
      - "scripts/vibelution_launcher.ps1"
      - "scripts/vibelution_launcher.py"
      - "tests/test_runtime_manager.py"
      - "tests/test_launcher_scripts.py"
      - "tests/test_launcher_scripts_contract.py"
      - "tests/test_launcher_service.py"
      - "tests/test_web_runtime_routes.py"
      - "tests/helpers/web_runtime_scene.py"
    commands:
      - ".\\.venv\\Scripts\\python.exe -m pytest tests/test_launcher_scripts_contract.py tests/test_runtime_manager.py tests/test_launcher_service.py tests/test_web_runtime_routes.py -q"
    notes:
      - "Runtime lifecycle changes need an explicit Launcher refresh decision after automated validation."

  - id: desktop-electron-shell
    description: "Electron desktop shell, tray, IPC, and packaged Launcher control plane (ADR 0009)."
    executionLayers:
      - "focused"
      - "local-serial"
    paths:
      - "desktop/electron/**"
    commands:
      - "npm --prefix desktop/electron test"
    notes:
      - "Product control plane lives in Electron main; legacy Python launcher HTTP is not the packaged path."
      - "Tray/restart/workbench lifecycle changes need Launcher refresh decision after vitest."

  - id: web-evolution
    description: "Supervised/self evolution web routes, harness, and control-plane services."
    executionLayers:
      - "focused"
      - "local-serial"
    paths:
      - "core/evaluation/**"
      - "core/web/routes/evolution.py"
      - "core/web/services/evolution_service.py"
      - "core/web/services/self_evolution_*.py"
      - "core/web/services/supervised_*.py"
      - "scripts/evolution_harness.py"
      - "tests/test_web_evolution_routes.py"
      - "tests/test_evolution_harness.py"
      - "tests/test_gym_*.py"
    commands:
      - ".\\.venv\\Scripts\\python.exe -m pytest tests/test_web_evolution_routes.py tests/test_evolution_harness.py tests/test_gym_engine.py tests/test_gym_runner.py tests/test_gym_promotion.py -q"
    notes:
      - "Keep evolution route tests serial unless the touched file is known to be isolated."

  - id: config-models
    description: "Operator config, public config panel, model library, prompt cache, and LLM client routing."
    executionLayers:
      - "focused"
      - "local-serial"
      - "local-parallel"
    paths:
      - "config/**"
      - "core/llm/**"
      - "core/llm/payload_builder.py"
      - "core/llm/PROTOCOL.md"
      - "core/web/services/config_service.py"
      - "tests/test_web_config_routes.py"
      - "tests/test_config_panel.py"
      - "tests/test_config_sync.py"
      - "tests/test_public_config_model_refs.py"
      - "tests/test_llm_client.py"
      - "tests/test_prompt_cache_hit_optimization.py"
      - "tests/test_llm_invocation_context.py"
      - "tests/test_llm_protocol_cache_alignment.py"
      - "tests/test_llm_protocol_resolver.py"
      - "tests/test_llm_wire_*.py"
      - "tests/test_turn_status_bar_and_budget_profiles.py"
    commands:
      - ".\\.venv\\Scripts\\python.exe -m pytest tests/test_llm_protocol_cache_alignment.py tests/test_llm_protocol_resolver.py tests/test_llm_wire_chat_completions.py tests/test_llm_wire_responses.py tests/test_prompt_cache_hit_optimization.py tests/test_llm_invocation_context.py tests/test_turn_status_bar_and_budget_profiles.py -q"
      - ".\\.venv\\Scripts\\python.exe -m pytest tests/test_web_config_routes.py tests/test_config_panel.py tests/test_config_sync.py tests/test_public_config_model_refs.py tests/test_llm_client.py -q"
    notes:
      - "Verify effective config behavior, not only source defaults."
      - "Protocol/wire/cache tests are parallel-safe; config panel and web config routes stay serial."
      - "Turn status bar placement affects DeepSeek automatic prefix cache; keep with LLM hot path."

  - id: agent-directory-config
    description: "Agent directory, mode binding, prompt templates, and model reference repair."
    executionLayers:
      - "focused"
      - "local-parallel"
      - "remote-distributed"
    paths:
      - "core/web/services/agent_directory_service.py"
      - "core/web/services/agent_mode_binding_service.py"
      - "core/web/services/model_reference_service.py"
      - "core/web/services/prompt_template_service.py"
      - "tests/test_agent_config_workspace_service.py"
      - "tests/test_agent_mode_binding_service.py"
      - "tests/test_model_reference_service.py"
      - "tests/test_prompt_template_service.py"
    commands:
      - ".\\.venv\\Scripts\\python.exe -m pytest tests/test_agent_config_workspace_service.py tests/test_agent_mode_binding_service.py tests/test_model_reference_service.py tests/test_prompt_template_service.py -q"
    notes:
      - "Agent configuration changes should validate directory repair, mode bindings, model references, and prompt template contracts together."

  - id: memory-cleanup
    description: "Memory overview, cleanup, reset, and memory route behavior."
    executionLayers:
      - "focused"
      - "local-parallel"
      - "remote-distributed"
    paths:
      - "core/web/services/memory_cleanup_service.py"
      - "core/web/services/memory_service.py"
      - "core/web/routes/memory.py"
      - "tests/test_memory_cleanup_service.py"
      - "tests/test_web_memory_routes.py"
      - "tests/test_reset_service.py"
    commands:
      - ".\\.venv\\Scripts\\python.exe -m pytest tests/test_memory_cleanup_service.py tests/test_web_memory_routes.py tests/test_reset_service.py -q"
    notes:
      - "Memory cleanup changes must keep preview, protection, and route contracts aligned."

  - id: tool-registry
    description: "Tool registry service, generated tool metadata, and tool route contracts."
    executionLayers:
      - "focused"
      - "local-parallel"
      - "remote-distributed"
    paths:
      - "core/web/services/tool_registry_service.py"
      - "core/web/routes/tools.py"
      - "tests/test_tool_registry_service.py"
      - "tests/test_tool_registry_routes.py"
    commands:
      - ".\\.venv\\Scripts\\python.exe -m pytest tests/test_tool_registry_service.py tests/test_tool_registry_routes.py -q"
      - ".\\.venv\\Scripts\\python.exe tests/prompt_debugger.py --suite --quick"
    notes:
      - "Tool registry changes need route/service validation and prompt debugger coverage because they affect tool visibility."

  - id: git-worktree
    description: "Git service, Git memory, worktree hygiene, and no-console Git process paths."
    executionLayers:
      - "focused"
      - "local-serial"
    paths:
      - "core/infrastructure/git_process.py"
      - "core/infrastructure/git_memory.py"
      - "core/web/services/git_status_service.py"
      - "tests/test_git_process.py"
      - "tests/test_git_memory.py"
      - "tests/test_git_status_service.py"
      - "tests/test_web_git_routes.py"
    commands:
      - ".\\.venv\\Scripts\\python.exe -m pytest tests/test_git_process.py tests/test_git_memory.py tests/test_git_status_service.py tests/test_web_git_routes.py -q"
    notes:
      - "On Windows, include no-console regression coverage for runtime Git paths."

  - id: teams-knowledge
    description: "Teams, Team Knowledge, Challenge Cup flow, and source collection workflow."
    executionLayers:
      - "focused"
      - "local-parallel"
      - "remote-distributed"
    paths:
      - "core/web/services/team_service.py"
      - "core/web/services/team_knowledge_service.py"
      - "core/web/services/team_workflow_orchestration_service.py"
      - "core/web/services/team_workflow/**"
      - "core/web/routes/team_workflows/**"
      - "tests/test_team_service.py"
      - "tests/test_team_knowledge_service.py"
      - "tests/test_team_workflow_orchestration_service.py"
      - "tests/test_team_workflow_structure_cases.py"
      - "tests/test_team_workflow_source_collection_cases.py"
      - "tests/test_team_workflow_experiment_cases.py"
      - "tests/test_team_workflow_research_knowledge_cases.py"
      - "tests/test_team_workflow_remainder_cases.py"
      - "tests/test_team_workflow_facade_contract.py"
      - "tests/test_team_workflow_structure_packs.py"
      - "tests/test_team_workflow_routes.py"
      - "tests/_support/team_workflow/**"
    commands:
      - ".\\.venv\\Scripts\\python.exe -m pytest tests/test_team_workflow_facade_contract.py tests/test_team_workflow_structure_packs.py tests/test_team_service.py tests/test_team_knowledge_service.py -q"
      - ".\\.venv\\Scripts\\python.exe -m pytest tests/test_team_workflow_routes.py tests/test_team_workflow_structure_cases.py tests/test_team_workflow_source_collection_cases.py tests/test_team_workflow_experiment_cases.py tests/test_team_workflow_research_knowledge_cases.py tests/test_team_workflow_remainder_cases.py -n 4 --dist loadfile -q"
    notes:
      - "Challenge Cup workflow changes are verified through the versioned Teams tests; route UI changes use the focused frontend rule below."
      - "Behavioral cases are split into five domain packs for xdist loadfile; the aggregate test_team_workflow_orchestration_service.py is skipped when those packs are collected."
      - "Single-domain debug: pytest tests/test_team_workflow_source_collection_cases.py -q (or cases_*.py under _support/)."
      - "Team workflow Python tests are not serial-marked; use local-parallel / remote-distributed for speed."

  - id: teams-knowledge-ui
    description: "Teams and Challenge Cup route UI focused validation."
    executionLayers:
      - "focused"
      - "frontend"
    paths:
      - "web/src/routes/TeamsRoute.tsx"
      - "web/src/routes/TeamsRoute.styles.ts"
      - "web/src/routes/TeamsRoute.layout.test.ts"
      - "web/src/routes/TeamsRoute.*"
      - "web/src/routes/teams/**"
    commands:
      - "node web/node_modules/vitest/vitest.mjs run src/routes/teams TeamsRoute.layout.test.ts"
      - "node web/node_modules/vitest/vitest.mjs run src/components/vui/vuiShadcnRouteContract.test.ts src/components/vui/vuiComponentDesignContract.test.ts"
      - "npm --prefix web exec -- tsc -b --pretty false"
    notes:
      - "Small Teams UI changes keep a focused route test, both VUI contracts, and incremental typecheck; they do not imply workflow pytest or a full build."

  - id: frontend-build-inputs
    description: "Frontend dependency, compiler, bundler, entrypoint, and static build inputs."
    executionLayers:
      - "focused"
      - "frontend"
    paths:
      - "web/package.json"
      - "web/package-lock.json"
      - "web/vite.config.*"
      - "web/tsconfig*.json"
      - "web/index.html"
      - "web/src/main.tsx"
      - "web/public/**"
      - "web/scripts/**"
    commands:
      - "node web/node_modules/vitest/vitest.mjs run"
      - "npm --prefix web run build"
    notes:
      - "Full Vitest and Vite build are reserved for inputs that can change the build graph or generated output."

  - id: frontend-workbench
    description: "Workbench routes, components, app shell, and route-level layout tests."
    executionLayers:
      - "focused"
      - "frontend"
    fallback: true
    paths:
      - "web/src/routes/**"
      - "web/src/components/**"
      - "web/src/app/**"
    commands:
      - "node web/node_modules/vitest/vitest.mjs run src/components/vui/vuiShadcnRouteContract.test.ts src/components/vui/vuiComponentDesignContract.test.ts"
      - "node web/node_modules/vitest/vitest.mjs run --changed main --passWithNoTests"
      - "npm --prefix web exec -- tsc -b --pretty false"
    notes:
      - "VUI/shadcn route contract + component design catalog are mandatory for any web UI path (root AGENTS.md §2)."
      - "The UI fallback keeps changed-file Vitest, both VUI contracts, and incremental typecheck; it is suppressed file-by-file when a focused frontend rule owns every changed file."

  - id: frontend-non-ui
    description: "Shared frontend API types, API helpers, i18n, and non-visual TypeScript surfaces."
    executionLayers:
      - "focused"
      - "frontend"
    fallback: true
    paths:
      - "web/src/api/types/**"
      - "web/src/api/**"
      - "web/src/i18n/**"
      - "web/bundleBudget.test.ts"
    commands:
      - "node web/node_modules/vitest/vitest.mjs run --changed main --passWithNoTests"
      - "npm --prefix web exec -- tsc -b --pretty false"
    notes:
      - "Non-UI frontend changes use changed-file Vitest and incremental typecheck; VUI contracts are reserved for visible UI surfaces."

  - id: test-tool-authorization
    description: "Tool authorization implementation, fixtures, helpers, and authorization contract tests."
    executionLayers:
      - "focused"
    paths:
      - "core/authorization/**"
      - "core/logging/tool_authorization_events.py"
      - "core/orchestration/tool_authorization_binding.py"
      - "tests/helpers/tool_authorization.py"
      - "tests/fixtures/tool_authorization/**"
      - "tests/test_*authorization*.py"
    excludePaths:
      - "tests/*.md"
      - "tests/**/*.md"
    commands:
      - ".\\.venv\\Scripts\\python.exe -m pytest tests/test_tool_authorization_test_contract.py -q"
    notes:
      - "Authorization contract coverage is scoped to tests and authorization/tool paths; ordinary product and documentation edits do not run it."

  - id: docs-only
    description: "Documentation-only changes."
    executionLayers:
      - "hygiene"
    paths:
      - "*.md"
      - "docs/**"
      - ".docs/**"
      - "tests/*.md"
      - "tests/**/*.md"
      - "PROJECT_MEMORY.html"
    commands:
      - "git diff --check"
    notes:
      - "Docs-only changes normally do not require Launcher refresh or product version bump."
