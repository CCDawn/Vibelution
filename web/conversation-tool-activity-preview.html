<!doctype html>
<html lang="zh-CN" data-theme="light">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Codex Process Stream Preview</title>
    <link rel="stylesheet" href="./src/design/tokens.css" />
    <link rel="stylesheet" href="./src/design/conversation-tool-activity-preview.css" />
  </head>
  <body>
    <main class="conversation-preview">
      <article class="assistant-turn" aria-label="Agent 回答预览">
        <section class="process-disclosure" aria-label="处理记录">
          <button
            class="process-summary"
            type="button"
            aria-expanded="true"
            aria-controls="process-stream"
            data-process-toggle
          >
            <span data-process-label>已处理 13s</span>
            <svg viewBox="0 0 16 16" aria-hidden="true">
              <path d="m4.5 6 3.5 3.5L11.5 6" />
            </svg>
          </button>

          <div class="process-rule" aria-hidden="true"></div>

          <div class="process-stream" id="process-stream" data-process-stream>
            <p class="commentary">
              我会先读取资料上下文，围绕目标拆分检索查询，再综合可信来源形成回答。
            </p>

            <div class="tool-entry">
              <svg viewBox="0 0 16 16" aria-hidden="true">
                <rect x="2.5" y="3" width="11" height="10" rx="2" />
                <path d="m5 6 2 2-2 2m3.5 0h2.5" />
              </svg>
              <span>Ran 读取资料上下文</span>
            </div>

            <div class="tool-entry">
              <svg viewBox="0 0 16 16" aria-hidden="true">
                <circle cx="8" cy="8" r="5.5" />
                <path d="M2.8 8h10.4M8 2.5c1.6 1.5 2.4 3.3 2.4 5.5S9.6 12 8 13.5C6.4 12 5.6 10.2 5.6 8S6.4 4 8 2.5Z" />
              </svg>
              <span>Searched the web for 4 queries</span>
            </div>

            <div class="tool-entry">
              <svg viewBox="0 0 16 16" aria-hidden="true">
                <rect x="3" y="2.5" width="8.5" height="8.5" rx="1.5" />
                <path d="M5 5h4.5M5 7.5h3M5.5 13.5h7a1 1 0 0 0 1-1v-7" />
              </svg>
              <span>运行了多个命令</span>
            </div>

            <p class="commentary">
              检索已经返回官方文档与相关项目。我会保留可核验来源，并把原始参数留在内部记录中。
            </p>

            <div class="tool-entry" data-terminal-entry>
              <svg viewBox="0 0 16 16" aria-hidden="true">
                <path d="M8 2.5 9 6l3.5 1L9 8l-1 3.5L7 8 3.5 7 7 6l1-3.5Z" />
                <path d="m12 11 .45 1.55L14 13l-1.55.45L12 15l-.45-1.55L10 13l1.55-.45L12 11Z" />
              </svg>
              <span data-terminal-copy>整理了 8 个可信来源</span>
            </div>
          </div>
        </section>

        <div class="final-answer" data-final-answer>
          <p>已完成资料检索。下面是根据可信来源整理的结论。</p>
        </div>
      </article>
    </main>

    <aside class="preview-controls" aria-label="隔离预览控制">
      <span>预览</span>
      <button class="is-selected" type="button" data-state-control="completed" aria-pressed="true">完成</button>
      <button type="button" data-state-control="running" aria-pressed="false">运行</button>
      <button type="button" data-state-control="failed" aria-pressed="false">失败</button>
      <button type="button" data-theme-toggle>深色</button>
    </aside>

    <script src="./src/design/conversation-tool-activity-preview.js"></script>
  </body>
</html>
