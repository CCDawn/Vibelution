<!doctype html>
<html lang="zh-CN" translate="no" class="notranslate" data-theme="light">
  <head>
    <meta charset="UTF-8" />
    <meta name="google" content="notranslate" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#f7f8fa" />
    <meta name="color-scheme" content="light dark" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="icon" href="/favicon.ico" sizes="any" />
    <link rel="icon" type="image/png" href="/vibelution-icon.png" />
    <link rel="apple-touch-icon" href="/vibelution-icon-192.png" />
    <title>Vibelution Workbench</title>
  </head>
  <body translate="no" class="notranslate">
    <div id="root"></div>
    <script>
      (() => {
        try {
          const theme = localStorage.getItem("vibelution.workbench.theme");
          if (theme === "dark" || theme === "light") {
            document.documentElement.setAttribute("data-theme", theme);
          }
        } catch {
        }
        try {
          const dpr = Number(window.devicePixelRatio) || 1;
          let width = document.documentElement.clientWidth || window.innerWidth || 0;
          if (dpr > 1.05 && width >= 1140) {
            width = Math.round(width / dpr);
          }
          if (width > 0) {
            const px = `${Math.round(width)}px`;
            const sized = `min(${px}, 100svw)`;
            for (const node of [document.documentElement, document.body, document.getElementById("root")]) {
              if (!node) continue;
              node.style.overflowX = "clip";
              node.style.width = sized;
              node.style.maxWidth = sized;
              node.style.minWidth = "0";
            }
            document.documentElement.style.setProperty("--vui-window-width", px);
          }
        } catch {
        }
      })();
    </script>
    <script type="module" src="/src/main.tsx"></script>
  </body>
  </html>
