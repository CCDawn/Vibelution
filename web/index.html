<!doctype html>
<html lang="zh-CN" translate="no" class="notranslate" data-theme="light">
  <head>
    <meta charset="UTF-8" />
    <meta name="google" content="notranslate" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#f7f8fa" />
    <meta name="color-scheme" content="light dark" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="icon" href="/favicon.ico" sizes="any" />
    <link rel="icon" type="image/png" href="/vibelution-icon.png" />
    <link rel="apple-touch-icon" href="/vibelution-icon-192.png" />
    <title>Vibelution Workbench</title>
  </head>
  <body translate="no" class="notranslate">
    <div id="root"></div>
    <script>
      (() => {
        // Pre-bundle theme bootstrap (anti flash-of-wrong-theme). Pattern after
        // zai-org/ZCode `packages/web/index.html` (Apache-2.0): read the same
        // storage key as web/src/app/themePreference.ts (vibelution.workbench.theme,
        // default "light"), resolve data-theme, and paint the body canvas BEFORE
        // the deferred module bundle runs — the inline script executes
        // synchronously during HTML parsing, so the first paint already carries
        // the user's theme instead of flashing the opposite canvas.
        let theme = "light";
        try {
          const stored = localStorage.getItem("vibelution.workbench.theme");
          if (stored === "dark" || stored === "light") {
            theme = stored;
          }
        } catch {
        }
        // Same attribute AppShell/themePreference re-apply after mount; setting
        // the same value twice is a no-op.
        document.documentElement.setAttribute("data-theme", theme);
        try {
          // Matches base.css `body { background: var(--bg-canvas) }`; the
          // fallback hexes are the exact [data-theme] token values, so the
          // pre-CSS paint is identical to the post-CSS canvas. The desktop-pet
          // window must keep a transparent body (desktop-pet.tailwind.css), so
          // it opts out.
          if (window.location.pathname !== "/desktop-pet") {
            document.body.style.backgroundColor = `var(--bg-canvas, ${theme === "dark" ? "#0f1115" : "#f7f8fa"})`;
          }
          const themeColorMeta = document.querySelector('meta[name="theme-color"]');
          if (themeColorMeta) {
            themeColorMeta.setAttribute("content", theme === "dark" ? "#0f1115" : "#f7f8fa");
          }
        } catch {
        }
        try {
          for (const node of [document.documentElement, document.body, document.getElementById("root")]) {
            if (!node) continue;
            node.style.overflowX = "clip";
            node.style.width = "100%";
            node.style.maxWidth = "100%";
            node.style.minWidth = "0";
          }
          document.documentElement.style.setProperty("--vui-window-width", "100svw");
        } catch {
        }
      })();
    </script>
    <script type="module" src="/src/main.tsx"></script>
  </body>
  </html>
