<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>单一字号派生字阶预览 | Vibelution</title>
    <script>
      (() => {
        try {
          const params = new URLSearchParams(window.location.search);
          const theme = params.get("theme");
          if (theme === "dark" || theme === "light") {
            document.documentElement.setAttribute("data-theme", theme);
          }
          // 首屏前先落 base，避免派生字阶闪变（FOUC）。合法域 14–18，非法回 16。
          const raw = Number(params.get("base"));
          const base = Number.isFinite(raw) ? Math.min(18, Math.max(14, Math.round(raw))) : 16;
          document.documentElement.style.setProperty("--vui-font-base", base + "px");
          document.documentElement.setAttribute("data-font-base", String(base));
        } catch {
        }
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="./src/main.tsx"></script>
  </body>
</html>
