[package]
name = "vibelution-usage-normalize"
version = "0.1.0"
edition = "2021"
description = "Provider LLM usage / prompt-cache normalization (Rust pilot)"
license = "MIT"
publish = false

[[bin]]
name = "vibelution-usage-normalize"
path = "src/main.rs"

[lib]
name = "vibelution_usage_normalize"
path = "src/lib.rs"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
