[package]
name = "vibelution-path-containment"
version = "0.1.0"
edition = "2021"
description = "Project-root path containment checks (Rust pilot P1)"
license = "MIT"
publish = false

[[bin]]
name = "vibelution-path-containment"
path = "src/main.rs"

[lib]
name = "vibelution_path_containment"
path = "src/lib.rs"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
