[pytest]
# 测试发现路径
testpaths = tests

# 测试文件匹配规则
python_files = test_*.py
python_classes = Test*
python_functions = test_*

# 排除目录（backups 包含 18 个引用已删除模块的测试文件）
norecursedirs = tests/backups .venv .git __pycache__ node_modules

# 自定义 markers
markers =
    unit: 单元测试（无 I/O，无单例，快速）
    integration: 集成测试（需要文件系统、SQLite、单例）
    e2e: 端到端测试（需要真实 LLM）
    slow: 慢速测试（超过 2 秒）
    infrastructure: core/infrastructure/ 模块测试
    orchestration: core/orchestration/ 模块测试
    tools: tools/ 模块测试
    config: config/ 模块测试
    environment_smoke: 稳定环境烟雾测试
    serial: 必须串行运行的测试（真实进程、端口、共享全局状态或真实工作区）

# 默认选项：本地直接 pytest 仍串行 + 遇错即停。
# 进程并行请用：pytest -n N --dist loadfile -m "not serial"
# 或：python tests/test_runner.py --hybrid --workers 4
# （runner 会覆盖 -x 为 --maxfail=0 以收集批次失败）
addopts = -v -x --tb=short --strict-markers --no-header
